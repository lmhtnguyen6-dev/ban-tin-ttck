<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radar TTCK — Tin nóng tác động thị trường</title>
  <meta name="description" content="Bản tin tự động lọc bằng AI: chỉ tin tài chính, vĩ mô, chính sách, doanh nghiệp có tác động trực tiếp đến thị trường chứng khoán Việt Nam." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <span class="logo">◆</span>
        <div>
          <h1>Radar TTCK</h1>
          <p class="tagline">Tin nóng tác động thị trường chứng khoán — lọc bằng AI</p>
        </div>
      </div>
      <div class="meta">
        <span id="che-do" class="badge"></span>
        <span id="cap-nhat" class="muted"></span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <div id="filters" class="chips"></div>
      <input id="search" type="search" placeholder="Tìm trong tiêu đề / lý do..." />
    </div>

    <div id="trang-thai" class="trang-thai">Đang tải bản tin…</div>
    <div id="danh-sach" class="cards"></div>
  </main>

  <footer class="wrap foot">
    <p>Nguồn: CafeF · VnExpress · Vietstock · VietnamBiz. Tin được chấm điểm tác động và
       gộp trùng tự động — bấm tiêu đề để đọc bài gốc. Dữ liệu cập nhật tự động theo giờ.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
